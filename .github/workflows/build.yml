# Builds this template with the latest cuicui_core (web + Android).
# In your own app, pin the core (submodule or tag) instead of cloning its main branch.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mkdotcom/cuicui_core
          path: cuicui_core
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
      - name: Build (release)
        run: sh projects/web/_compile.sh release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: mkdotcom/cuicui_core
          path: cuicui_core
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build (debug)
        working-directory: projects/android
        run: bash gradlew assembleDebug
