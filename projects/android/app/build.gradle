apply plugin: 'com.android.application'

android {
    // Change this (and applicationId) to your own package name
    namespace 'com.example.cuicuiapp'
    compileSdk 36
    ndkVersion '27.2.12479018' // NDK 27: native libs aligned on 16 KB pages (required for Android 15+)

    defaultConfig {
        applicationId "com.example.cuicuiapp"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14 -DCUICUI_ANDROID"
            }
        }
    }

    // the Java side of cuicui (and of the modules you use)
    sourceSets {
        main.java.srcDirs += '../../../cuicui_core/android/'
    }

    buildTypes {
        debug {
            debuggable true
            externalNativeBuild {
                cmake {
                    cppFlags += "-DCUICUI_DEBUG"
                }
            }
        }
        release {
            debuggable false
            minifyEnabled false // the minifier could remove Java methods only called from C++
            externalNativeBuild {
                cmake {
                    cppFlags += "-O2 -DNDEBUG"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

dependencies {
    // used by cuicui_core/android
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    annotationProcessor 'androidx.lifecycle:lifecycle-compiler:2.2.0'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
}

// Copy app/assets into the Android assets at every build
tasks.register('syncAssetsFromSource', Sync) {
    from "$projectDir/../../../app/assets"
    into "$projectDir/src/main/assets"
}
tasks.named('preBuild').configure { dependsOn 'syncAssetsFromSource' }
